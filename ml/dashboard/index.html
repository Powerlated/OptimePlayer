<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>optime-ml — training</title>
<style>
  /* Palette: the data-viz reference instance. Categorical slot 1 (blue) = train,
     slot 2 (green) = held-out. Both modes validated against their own surface. */
  :root {
    color-scheme: light;
    --surface-0: #f4f4f2;
    --surface-1: #fcfcfb;
    --border:    #dcdcd6;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #78776f;
    --series-1: #2a78d6;
    --series-2: #008300;
    --good: #008300;
    --grid: #e6e6e1;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0: #111110;
      --surface-1: #1a1a19;
      --border:    #34342f;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8f8e84;
      --series-1: #3987e5;
      --series-2: #008300;
      --good: #4ea94e;
      --grid: #2a2a26;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-0);
    color: var(--text-primary);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); font-size: 13px; }
  .pill {
    font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--text-secondary); white-space: nowrap;
  }
  .pill.live { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--border)); }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 5px; vertical-align: 1px; }
  .pill.live .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; margin-top: 14px;
  }
  .card h2 { font-size: 13px; font-weight: 600; margin: 0 0 2px; }
  .card .hint { color: var(--text-muted); font-size: 12px; margin: 0 0 10px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; margin-top: 14px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; }
  .tile .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .tile .value { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .tile .value small { font-size: 13px; font-weight: 500; color: var(--text-secondary); }

  .bar { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; background: var(--series-1); border-radius: 3px; transition: width .4s ease; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 2.5px; border-radius: 2px; background: currentColor; }
  .swatch.s1 { background: var(--series-1); }
  .swatch.s2 { background: var(--series-2); }

  .plot { width: 100%; height: auto; display: block; touch-action: none; }
  .plot text { fill: var(--text-muted); font-size: 10px; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--border); stroke-width: 1; }
  .s1-line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .s2-line { fill: none; stroke: var(--series-2); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .s2-dot { fill: var(--series-2); stroke: var(--surface-1); stroke-width: 2; }
  .s1-dot { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
  .crosshair { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .direct-label { font-size: 11px; font-weight: 600; }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 10;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 7px;
    padding: 7px 9px; font-size: 12px; box-shadow: 0 6px 20px rgb(0 0 0 / .16);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; }
  .tooltip .tt-key { color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }

  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--border); font-size: 12px; }
  th { color: var(--text-muted); font-weight: 500; text-transform: uppercase; font-size: 10px; letter-spacing: .04em; }
  th:first-child, td:first-child { text-align: left; }
  tbody tr:last-child td { border-bottom: 0; }
  .scroll { overflow-x: auto; max-height: 320px; overflow-y: auto; }

  /* Fact grid: a label, a headline value, and the value's qualifier underneath —
     the qualifier is where the assumption (120bpm, ×12) gets stated, never dropped. */
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .fact { display: flex; flex-direction: column; gap: 2px; }
  .fact .k { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .fact .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .fact .v em { display: block; font-size: 11px; font-weight: 400; font-style: normal; color: var(--text-secondary); letter-spacing: 0; }

  .cfg-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 24px; }
  .cfg-cols h3 { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin: 4px 0 2px; }
  .cfg-cols td:first-child { color: var(--text-secondary); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  .cfg-cols td:last-child { font-weight: 600; }

  .empty { color: var(--text-muted); padding: 22px 0; text-align: center; font-size: 13px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--text-secondary); }
  .meta-line { color: var(--text-muted); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
  <div id="app"></div>
  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/app.js"></script>
</body>
</html>
