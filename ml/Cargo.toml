[package]
name = "optime-ml"
version = "0.1.0"
edition = "2021"

[workspace]

[features]
# Enables the real-song harvester + real-song eval, which depend on the main
# engine crate. Off by default so the pure-synthetic build stays engine-free.
harvest = ["dep:optime-core"]
# WGPU GPU backend (cubecl-wgsl shaders → Vulkan/DX12/Metal). Off by default so
# the lean CPU build is unaffected; enables `hier_pretrain_gpu`.
gpu = ["burn/webgpu"]
# CUDA backend (cubecl → nvrtc → PTX). Swaps `backend::{Inner, MlDevice}`, so every
# bin runs on the GPU with no other change. Needs a CUDA *toolkit* (nvrtc), not just
# a driver — cubecl compiles kernels at runtime. Off by default: the CPU build must
# keep working on machines with no NVIDIA GPU.
cuda = ["burn/cuda"]

[dependencies]
bincode = "1"
burn = { version = "0.21.0", features = ["ndarray", "autodiff", "train"] }
# The one binary's arg parser: subcommands + `--help` for the whole pipeline.
clap = { version = "4", features = ["derive"] }
flate2 = "1"
burn-ndarray = { version = "0.21", features = ["multi-threads"] }
rand = "0.8"
rayon = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Only for `--features harvest`: run device sequencers headlessly to harvest real
# game songs. Scalar gather (no `simd`) — the headless player never resamples audio.
optime-core = { path = "../crates/optime-core", default-features = false, optional = true }

# One binary, `optime-ml` (src/main.rs), with clap subcommands for the whole pipeline.
# Harvest- and GPU-only subcommands are `#[cfg]`'d in, so building without the feature
# simply drops them (the old per-bin `required-features` behavior).
