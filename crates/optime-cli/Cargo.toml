[package]
name = "optime-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline command-line tools for the Optime Player engine: renders, exports, dumps, benchmarks."

[features]
# Nightly portable-SIMD sinc gather (see optime-core's feature of the same name).
simd = ["optime-core/simd"]

[dependencies]
optime-core = { path = "../optime-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
# `export-album`: FLAC encoding (rayon = parallel channel compression), EBU R128 loudness
# measurement, and progress bars. `match-ost` and the album render share rayon.
flac-codec = { version = "1.3", features = ["rayon"] }
ebur128 = "0.1"
indicatif = "0.17"
rayon = "1"
# `match-ost`: decoding the reference soundtrack recordings, and the FFT its chroma features
# are built from.
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "pcm", "isomp4", "aac"] }
rustfft = "6"
