<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Optime Player</title>
    <link data-trunk rel="rust" data-bin="optime-app" data-wasm-opt="2" />
    <link data-trunk rel="copy-file" href="../../demos/super-mario-64-ds.sdat" />
    <link data-trunk rel="copy-file" href="../../demos/new-super-mario-bros.sdat" />
    <link data-trunk rel="copy-file" href="../../demos/pokemon-platinum.sdat" />
    <link data-trunk rel="copy-file" href="../../demos/pokemon-heartgold.sdat" />
    <link data-trunk rel="copy-file" href="../../demos/pokemon-black-2.sdat" />
    <link data-trunk rel="copy-file" href="../../demos/ace-attorney.sdat" />
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1e1e1e; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #loading { position: absolute; inset: 0; display: flex; align-items: center;
                   justify-content: center; color: #ccc; font-family: sans-serif; }
    </style>
</head>

<body>
    <canvas id="the_canvas_id"></canvas>
    <div id="loading">Loading Optime Player…</div>
    <script>
        // Hide the loading text once the canvas is painted.
        const obs = new MutationObserver(() => {
            const c = document.getElementById("the_canvas_id");
            if (c && c.width > 0) {
                const l = document.getElementById("loading");
                if (l) l.remove();
                obs.disconnect();
            }
        });
        obs.observe(document.getElementById("the_canvas_id"), { attributes: true });
    </script>
</body>

</html>
