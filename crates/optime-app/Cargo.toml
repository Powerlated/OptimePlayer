[package]
name = "optime-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "egui front-end (desktop + web) for the Optime Player DS sound engine."

[features]
# Nightly portable-SIMD sinc gather (see optime-core's feature of the same name).
simd = ["optime-core/simd"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
optime-core = { path = "../optime-core" }
optime-ui = { path = "../optime-ui" }
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui = "0.35"
egui_plot = "0.36"
cpal = "0.15"
log = "0.4"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Transparent gunzip of gzipped inputs (compressed demos / user files). The default `miniz_oxide`
# backend is pure Rust, so it works on the wasm target too.
flate2 = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
# OS media-transport controls (Windows SMTC / macOS Now Playing / Linux MPRIS) for hardware and
# Bluetooth media keys, e.g. AirPods double-tap to skip.
souvlaki = "0.8"
raw-window-handle = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3"
cpal = { version = "0.15", features = ["wasm-bindgen"] }
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "MediaMetadata",
    "MediaSession",
    "MediaSessionAction",
    "MediaSessionActionDetails",
    "MediaSessionPlaybackState",
    "Navigator",
    "Performance",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Url",
    "Window",
    "History",
    "UrlSearchParams",
] }
