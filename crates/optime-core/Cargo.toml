[package]
name = "optime-core"
description = "Platform-independent Nintendo DS SDAT sound engine (SSEQ player)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[features]
default = ["simd"]
# Vectorizes the sinc gather with `std::simd` (portable SIMD). Requires a nightly toolchain
# (`cargo +nightly … --features simd`); best paired with `-C target-cpu=native` so the portable
# gathers lower to real hardware gathers (AVX2+ on x86-64).
simd = []

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Used only by the `export_album_flac` example (offline soundtrack render): FLAC encoding,
# EBU R128 loudness measurement, song-name JSON parsing, CLI args, and progress bars.
flac-codec = "1.3"
ebur128 = "0.1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
