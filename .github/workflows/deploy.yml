name: Deploy web app to GitHub Pages

on:
  push:
    branches: [rust-rewrite, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping queued runs in between.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with wasm target)
        # Nightly: the default `simd` feature uses portable SIMD (see rust-toolchain.toml).
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build (Trunk, release)
        working-directory: crates/optime-app
        # The trailing-slashed public URL makes asset paths work under the project subpath
        # (https://<user>.github.io/<repo>/).
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"

      - name: Stage legacy JS app under /legacy-js
        # The legacy browser app is a self-contained static site that references
        # fonts/, assets/, and demos/*.sdat relative to its own directory. Copy it
        # plus only the shared resources it loads into dist/legacy-js so it is served
        # at https://<user>.github.io/<repo>/legacy-js/.
        run: |
          dest=crates/optime-app/dist/legacy-js
          mkdir -p "$dest"
          cp -r legacy-js/. "$dest/"
          cp -r fonts "$dest/fonts"
          mkdir -p "$dest/assets"
          cp assets/piano_section_1.png assets/piano_section_2.png assets/piano_section_3.png "$dest/assets/"
          mkdir -p "$dest/demos"
          for demo in new-super-mario-bros super-mario-64-ds pokemon-platinum pokemon-heartgold pokemon-black-2 ace-attorney; do
            cp "demos/$demo.sdat" "$dest/demos/"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/optime-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
