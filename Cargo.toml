[workspace]
resolver = "3"
members = ["crates/optime-core", "crates/optime-app", "crates/optime-cli"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "ISC"
repository = "https://github.com/Powerlated/OptimePlayer"

[profile.release]
opt-level = 3
lto = "off"
codegen-units = 16

# Release code plus the debug info AMD uProf and Intel VTune need to attribute samples to source
# lines. `cargo build --profile profiling --bin profile-emerald`; artifacts land in
# `target/profiling/`, so they never overwrite a release build. Inlining stays on, so a hot leaf may
# be reported inside its caller.
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
