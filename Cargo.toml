[workspace]
resolver = "3"
members = [
    "crates/optime-core",
    "crates/optime-ui",
    "crates/optime-app",
    "crates/optime-plug",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "ISC"
repository = "https://github.com/Powerlated/OptimePlayer"

[profile.release]
opt-level = 3
lto = "off"
codegen-units = 16
